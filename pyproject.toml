[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-orderflow"
version = "1.0.0"
description = "Order-book imbalance in BTCUSDT: no standalone alpha, but cheaper execution"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.5", "scipy>=1.18", "matplotlib>=3.11"]

[project.optional-dependencies]
notebooks = ["ipykernel", "nbconvert", "nbformat"]

[tool.setuptools]
packages = ["orderflow"]
